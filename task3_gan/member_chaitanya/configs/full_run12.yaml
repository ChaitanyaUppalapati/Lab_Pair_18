# full_run12: photo -> Monet specialisation. Resumes full_run10's final state (2-scale discriminators, evaluation-scale
# training, lambda_cycle 2 / lambda_identity 0), replaces G_A2B with the best Monet -> photo generator (blend p1:
# full_run07 EMA 88+90) and G_B2A with the best photo -> Monet generator (full_run10 EMA 98), FREEZES G_A2B and
# fine-tunes only G_B2A (+ both discriminators); the frozen G_A2B still serves as the fixed inverse in the cycle loss.
# Warm restart 5e-5 -> 0 over 8 epochs, EMA, snapshots every 2 epochs.
# Reason: in runs 7-10 one direction usually improved while the other got worse; freezing the stronger Monet -> photo
# generator lets photo -> Monet improve without that trade-off. Design decision by Claude at the user's direction.
run_id: full_run12
seed: 1337

data:
  monet_dir: task3_gan/data/monet_jpg     # domain A (Kaggle naming)
  photo_dir: task3_gan/data/photo_jpg     # domain B
  load_size: 256                          # no zoom-crop: train at the evaluation scale (runs 1-8: 286)
  crop_size: 256
  hflip: true                             # same augmentation for both domains, drawn independently
  num_workers: 4

model:
  ngf: 64
  n_res_blocks: 9
  n_downsampling: 2
  upsampling: nearest_conv                # nearest-neighbour 2x + 3x3 conv
  ndf: 64                                 # PatchGAN C64-C128-C256-C512
  d_scales: 2                             # multi-scale discriminator (runs 1-9: 1)
  norm: instance
  init_std: 0.02

loss:
  adversarial: lsgan                      # MSE
  lambda_cycle: 2.0                       # run 6: 5, runs 1-5: 10
  lambda_identity: 0.0                    # run 6: 0.5, runs 1-5: 5
  d_loss_scale: 0.5                       # D loss halved

training:
  batch_size: 1
  epochs: 112                             # fine-tune epochs 105-112 on top of run 10's epoch-104 state
  constant_lr_epochs: 104                 # decay over epochs 105-112
  lr_g: 5.0e-5
  lr_d: 5.0e-5
  betas: [0.5, 0.999]
  pool_size: 50                           # per-discriminator history buffer
  precision: fp32
  cudnn_benchmark: true                   # cuDNN autotuning: ~6.5 h vs ~8 h for 40 epochs; not bitwise reproducible
  diffaugment_monet_d: true              # DiffAugment (translation + cutout) on real and fake before D_A (Monet)
  diffaugment_photo_d: true              # ... and before D_B (photo)
  ema_decay: 0.9999                       # generator EMA for snapshots / inference
  freeze_generators: [G_A2B]
  init_generators:
    G_A2B: task3_gan/member_chaitanya/checkpoints/full_blends/epoch_p1/G_A2B.pt
    G_B2A: task3_gan/member_chaitanya/checkpoints/full_run10/epoch_098_ema/G_B2A.pt
  log_every_iters: 100
  grid_every_epochs: 1
  checkpoint_every_epochs: 2
  num_fixed_samples: 4                    # per domain, for the per-epoch progress grid
