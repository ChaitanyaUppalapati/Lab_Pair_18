# full_run14: fine-tune of full_run11's final (epoch-40) state with the settings that helped the run-2 line:
# lambda_cycle 5 -> 2, lambda_identity 0.5 -> 0 (run 7), evaluation-scale training (load 256 = crop 256, run 9),
# 2-scale discriminators and EMA continued, warm restart 5e-5 -> 0 over 8 epochs, snapshots every 2 epochs.
run_id: full_run14
seed: 1337

data:
  monet_dir: task3_gan/data/monet_jpg     # domain A (Kaggle naming)
  photo_dir: task3_gan/data/photo_jpg     # domain B
  load_size: 256                          # evaluation scale (run 11: 286)
  crop_size: 256
  hflip: true                             # same augmentation for both domains, drawn independently
  num_workers: 4

model:
  ngf: 64
  n_res_blocks: 9
  n_downsampling: 2
  upsampling: nearest_conv                # nearest-neighbour 2x + 3x3 conv
  ndf: 64                                 # PatchGAN C64-C128-C256-C512
  d_scales: 2                             # multi-scale discriminator
  norm: instance
  init_std: 0.02

loss:
  adversarial: lsgan                      # MSE
  lambda_cycle: 2.0                       # run 11: 5
  lambda_identity: 0.0                    # run 11: 0.5
  d_loss_scale: 0.5                       # D loss halved

training:
  batch_size: 1
  epochs: 48                              # fine-tune epochs 41-48 on top of run 11's 40
  constant_lr_epochs: 40                  # decay over epochs 41-48
  lr_g: 5.0e-5
  lr_d: 5.0e-5
  betas: [0.5, 0.999]
  pool_size: 50                           # per-discriminator history buffer
  precision: fp32
  cudnn_benchmark: true                   # cuDNN autotuning: ~6.5 h vs ~8 h for 40 epochs; not bitwise reproducible
  diffaugment_monet_d: true              # DiffAugment (translation + cutout) on real and fake before D_A (Monet)
  diffaugment_photo_d: true              # ... and before D_B (photo)
  ema_decay: 0.9999
  log_every_iters: 100
  grid_every_epochs: 1
  checkpoint_every_epochs: 2
  num_fixed_samples: 4                    # per domain, for the per-epoch progress grid
