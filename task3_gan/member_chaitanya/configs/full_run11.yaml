# full_run11: from-scratch run combining what worked so far: DiffAugment on both discriminators (run 2),
# lambda_cycle 5 / lambda_identity 0.5 (run 6 - stable from scratch; lower values are left for a final fine-tune),
# 2-scale discriminators (run 10), generator EMA 0.9999 from the start, 40 epochs (20 constant + 20 decay).
# Reason: all gains since run 2 came from fine-tunes of the same run-2 solution; a fresh run trained with the
# better objective and discriminator may reach a better solution.
run_id: full_run11
seed: 1337

data:
  monet_dir: task3_gan/data/monet_jpg     # domain A (Kaggle naming)
  photo_dir: task3_gan/data/photo_jpg     # domain B
  load_size: 286                          # resize before random crop
  crop_size: 256
  hflip: true                             # same augmentation for both domains, drawn independently
  num_workers: 4

model:
  ngf: 64
  n_res_blocks: 9
  n_downsampling: 2
  upsampling: nearest_conv                # nearest-neighbour 2x + 3x3 conv
  ndf: 64                                 # PatchGAN C64-C128-C256-C512
  d_scales: 2                             # multi-scale discriminator
  norm: instance
  init_std: 0.02

loss:
  adversarial: lsgan                      # MSE
  lambda_cycle: 5.0
  lambda_identity: 0.5
  d_loss_scale: 0.5                       # D loss halved

training:
  batch_size: 1
  epochs: 40                              # one epoch = one pass over the photos
  constant_lr_epochs: 20                  # then linear decay to 0 over the remaining 20
  lr_g: 2.0e-4
  lr_d: 2.0e-4
  betas: [0.5, 0.999]
  pool_size: 50                           # per-discriminator history buffer
  precision: fp32
  cudnn_benchmark: true                   # cuDNN autotuning: ~6.5 h vs ~8 h for 40 epochs; not bitwise reproducible
  diffaugment_monet_d: true              # DiffAugment (translation + cutout) on real and fake before D_A (Monet)
  diffaugment_photo_d: true              # ... and before D_B (photo)
  ema_decay: 0.9999
  log_every_iters: 100
  grid_every_epochs: 1
  checkpoint_every_epochs: 5
  num_fixed_samples: 4                    # per domain, for the per-epoch progress grid
